<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Project 3</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Interactive Web Elements</h1>
        <p class="subtitle">A simple interactive webpage using HTML, CSS and JavaScript</p>

        <div class="section">
            <button id="darkModeBtn">Toggle Dark Mode</button>
        </div>

        <div class="section">
            <h2 id="message">Welcome to my webpage!</h2>
            <button id="changeTextBtn">Change Message</button>
        </div>

        <div class="section">
            <h2>Counter</h2>

            <div class="counter-box">
                <button id="decrease">➖</button>
                <span id="count">0</span>
                <button id="increase">➕</button>
            </div>
        </div>

        <div class="section">
            <button id="toggleContent">Show / Hide Content</button>

            <div id="content">
                <p>
                    🎉 This content can be hidden and shown using JavaScript.
                    DOM Manipulation makes webpages interactive and dynamic.
                </p>
            </div>
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
